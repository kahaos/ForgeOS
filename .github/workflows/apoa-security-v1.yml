name: Apoa Security Core v1

on:
  push:
    branches:
      - apoa-core-v1
  pull_request:
    branches:
      - apoa-core-v1

jobs:
  security-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Apoa security tests
        run: pytest -q tests/test_apoa_core_v1.py
